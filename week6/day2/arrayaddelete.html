<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Array Example</title>
    
</head>

<body>
   <button onclick="addArray()">Add Array</button>
   <button onclick="deleteArray()">Delete Array</button>
   <button onclick="addArrayHead()">Add Array (unshift)</button>
   <button onclick="deleteArrayHead()">Delete Array (shift)</button>
   <script>
      var fruits=[];
      function addArray(){
          let f1=prompt("請輸入水果名稱");
          fruits.push(f1);
          console.log(fruits);
      }
      function deleteArray(){
          let deletedfruits = fruits.pop();
          console.log("deleted fruit is :"+deletedfruits);
          console.log("fruits array is now :"+fruits);
      }
      function addArrayHead(){
          let f1=prompt("請輸入水果名稱");
          fruits.unshift(f1);
          console.log(fruits);
      }
      function deleteArrayHead(){
          let deletedHead = fruits.shift();
          console.log("deleted fruit is :"+deletedHead);
          console.log("fruits array is now :"+fruits);
      }
      
   </script>
</body>

</html>
