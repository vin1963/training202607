<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Guess Game</title>
    
</head>

<body>
   <button onclick="startGame()">Start Game</button>
   <script>
      
        function startGame() {           
            let guess;
            let attempts = 0;
            let randomNumber = Math.floor(Math.random() * 100) + 1;
            while (guess != randomNumber) {
                guess = parseInt(prompt("Guess a number between 1 and 100:"));
                attempts++;

                let msg=(guess < randomNumber) ?
                    "Too low! Try again.":
                    ( (guess > randomNumber) ?
                      "Too high! Try again.":`Congratulations! You guessed the number ${randomNumber} in ${attempts} attempts.`);
                alert(msg);
            }
        }
    </script>
</body>

</html>
